<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script><script>
const fallback={
name:"KIM WANG",position:"Purchasing Supervisor",company:"KOLEKSI ERA BARU SDN. BHD.",
business:"Household & Kitchenware Supplier",phone:"017-330 7258",whatsapp:"60173307258",
email:"kerabaru@hotmail.com",address:"NO 5, JALAN P2/6A,\nTIARA INDUSTRI PARK,\nBANDAR TEKNOLOGI KAJANG,\n43500 SEMENYIH,\nSELANGOR, MALAYSIA",
logo:"./logo.png",catalogue:"./catalogue-2026.pdf",
categories:["Cleaning Products","Kitchenware","Food Containers","Household Supplies"],
quote_title:"Looking for products or a quotation?",quote_text:"Send your product enquiry directly to KIM WANG via WhatsApp.",quote_button:"REQUEST QUOTATION"};
const txt=(id,v)=>document.getElementById(id).textContent=v||"";
const digits=v=>String(v||"").replace(/\D/g,"");
async function load(){
let d=fallback;
try{const r=await fetch("./data/site.json?v="+Date.now(),{cache:"no-store"});if(r.ok)d=Object.assign({},fallback,await r.json())}catch(e){}
document.title=(d.name||"KIM WANG")+" | "+(d.company||"");
document.querySelector(".logo img").src=d.logo||fallback.logo;
txt("company",d.company);txt("name",d.name);txt("role",d.position);txt("business",d.business);txt("phone",d.phone);txt("email",d.email);txt("address",d.address);
txt("quoteTitle",d.quote_title);txt("quoteText",d.quote_text);txt("quoteBtn",d.quote_button);
const w=digits(d.whatsapp||d.phone),wu="https://wa.me/"+w;
document.querySelector(".btn.primary").href=wu;
document.querySelector('.btn[href^="tel:"]').href="tel:+"+w;
document.getElementById("emailBtn").href="mailto:"+d.email;
document.getElementById("emailBtn").textContent="✉️ Email: "+d.email;
document.getElementById("catalogueBtn").href=d.catalogue||fallback.catalogue;
const box=document.querySelector(".products");box.innerHTML="";
(d.categories||[]).forEach(x=>{const e=document.createElement("span");e.className="tag";e.textContent=x;box.appendChild(e)});
document.getElementById("quoteBtn").href=wu+"?text="+encodeURIComponent("Hi "+d.name+", I would like to enquire about your products.");
document.querySelector('a[href="#contact"]').onclick=function(e){
e.preventDefault();const addr=(d.address||"").replace(/\n/g,", ");
const vc=["BEGIN:VCARD","VERSION:3.0","FN:"+d.name,"ORG:"+d.company,"TITLE:"+d.position,"TEL;TYPE=CELL,VOICE:+"+w,"EMAIL:"+d.email,"ADR;TYPE=WORK:;;"+addr,"END:VCARD"].join("\n");
const blob=new Blob([vc],{type:"text/vcard;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");
a.href=url;a.download=(d.name||"contact").replace(/\s+/g,"_")+".vcf";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
}
load();
</script><script>
document.querySelector('a[href="#contact"]').addEventListener('click', function(e){
  e.preventDefault();
  const name = "KIM WANG";
  const phone = "+60173307258";
  const email = "kerabaru@hotmail.com";
  const company = "KOLEKSI ERA BARU SDN. BHD.";
  const address = "NO 5, JALAN P2/6A, TIARA INDUSTRI PARK, BANDAR TEKNOLOGI KAJANG, 43500 SEMENYIH, SELANGOR, MALAYSIA";
  const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:${name}\nORG:${company}\nTITLE:Purchasing Supervisor\nTEL;TYPE=CELL,VOICE:${phone}\nEMAIL:${email}\nADR;TYPE=WORK:;;${address}\nEND:VCARD`;
  const blob = new Blob([vcard], {type:"text/vcard;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "KIM_WANG.vcf"; a.click();
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
